# Screen rules for Command Code (`cmd` CLI, npm package `command-code`).
# Written for this fork from captured screens; no herdr manifest exists.
# Derived from the installed Command Code 1.88.3 renderer (read-only bundle),
# plus captured 1.88.2–1.88.3 screens. Built-in status labels only.
# English UI only; translated labels and unbounded remote setup messages
# are outside this inventory.
# Known gap: arbitrary mod-provided status text is not recognized. A mod
# rendering the same bytes as built-in UI is inherently indistinguishable.
id = "command-code"
version = "2026.11.05.15"
min_engine_version = 7
updated_at = "2026-11-05T07:43:03Z"
aliases = ["command_code"]

# The first-run folder-trust dialog: "Do you trust the files in this
# folder?" with numbered Yes/No and "↑/↓ to navigate · enter to select ·
# esc to exit" (cmd-trust-dialog fixture).
[[rules]]
id = "trust_folder_dialog"
state = "blocked"
kind = "permission"
priority = 300
region = "outside_full_width_prompt_box"
visible_blocker = true
regex = ['(?i)do\s+you\s+trust\s+the\s+files\s+in\s+this\s+folder\?', '(?i)enter\s+to\s+select', '(?i)esc\s+to\s+exit']
line_regex = ['^\s*❯?\s*\d+\.\s+(?i:yes|no)\b']

# Tool permissions replace the composer below the last divider. Require
# the dialog's own wording, Yes/No choices and selection controls; draft
# text inside a composer is outside this region.
[[rules]]
id = "tool_permission_dialog"
state = "blocked"
kind = "permission"
priority = 290
region = "after_last_full_width_rule"
visible_blocker = true
# Whitespace between words is equivalent to joining wrapped rows with one
# space. Keep choice rows physical, and require both Yes and No evidence.
regex = [
  '(?i)\benter\s+select\b',
  # The No choice must be last: subsequent rows may be wrapped label words
  # or controls, never another numbered option. Risk removes scoped Yes.
  '(?m)^[ \t]*[❯›]?[ \t]*\d+\.[ \t]+(?i:no)\b[^\r\n]*(?:\r?\n[ \t]*(?:[^\s\d❯›][^\r\n]*)?)*[ \t]*\z',
]
line_regex = ['^\s*❯?\s*1\.\s+(?i:yes)\b']
# PermissionPrompt, ShellPermissionPrompt and GenericPermissionPrompt have
# different headings/questions but the same choice/footer structure.
any = [
  { regex = ['(?i)\bcommand\s+code\s+needs\s+to\s+(?:execute|run)\b'], any = [
    { regex = ['(?im)^\s*Execute\s+Shell\s+Command\s*$'] },
    { regex = ['(?im)^\s*Tool\s+Permission\s*$'] },
  ] },
  { regex = ['(?i)\bdo\s+you\s+want\s+to\s+(?:make\s+this\s+edit\s+to|create|delete|execute|modify)\b'], any = [
    { regex = ['(?im)^\s*Edit\s+File(?:\s|$)'] },
    { regex = ['(?im)^\s*(?:Create\s+File|Delete\s+File|Execute\s+File|File\s+Operation)\s*$'] },
  ] },
]

# Generated by scripts/detect/command-code-sweep.mjs from the closed built-in
# label inventory. Engine 7's prefix matcher recognizes word/character cuts
# in all Status layouts and RetryMessage; six non-padding characters are
# required unless the complete built-in label is shorter (e.g. Error).
# Status starts at column 0 or 1 when Ink clips; replies at column 2 cannot
# supply evidence. Only the last footer above a verified composer counts.
# Wrapped cloud ShimmerLine labels retain their complete known word shape.
[[rules]]
id = "turn_footer"
state = "working"
priority = 200
region = "above_full_width_prompt_box"
visible_working = true
any = [
  { prefix = { regex = '(?m)^ ?[·☆⌘◇○✧][ \t]*(?P<prefix>\S[^\r\n]*?)(?:[ \t]+(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z', min_chars = 6, patterns = ['(?:Pondering…|Contemplating…|Reasoning…|Reflecting…|Considering…|Deliberating…|Analyzing…|Evaluating…|Examining…|Inspecting…|Investigating…|Reviewing…|Researching…|Studying…|Exploring…|Mapping…|Tracing…|Parsing…|Processing…|Calculating…|Computing…|Synthesizing…|Planning…|Outlining…|Sketching…|Drafting…|Composing…|Crafting…|Building…|Assembling…|Constructing…|Designing…|Formulating…|Structuring…|Organizing…|Preparing…|Refining…|Polishing…|Honing…|Tuning…|Aligning…|Connecting…|Resolving…|Weaving…|Threading…)', '(?:Sculpting…|Crystallizing…|Channeling…|Conjuring…|Brewing…|Working…|Cogitating…|Ruminating…|Hypothesizing…|Conceptualizing…|Philosophizing…|Deciphering…|Demystifying…|Articulating…|Illuminating…|Elaborating…|Orchestrating…|Choreographing…|Architecting…|Calibrating…|Materializing…|Visualizing…|Harmonizing…|Contemplificating…|Supercalifragilisting…|Bibbidibobbidibooing…|Abracadabraing…|Hocuspocusing…|Razzmatazzing…|Shell command allowed|Shell command denied|Process termination allowed)', '(?:Process termination denied|Tool call allowed|Tool call denied|File operation allowed|File operation denied|Compacting conversation\.\.\.|Ready\.\.\.|Answers submitted|Failed to set provider|Restore failed|Connecting to the cloud…|Loading the conversation…|Loading the conversation|Starting the cloud session|Starting the cloud session…|Checking for updates\.\.\.|Naming session…|Failed to set model|Failed to set theme|Failed to set compact mode|Restoring checkpoint\.\.\.|Removing share link\.\.\.)', '(?:Context limit reached\. Auto-compacting the conversation\.\.\.|Connecting to the cloud|Creating a cloud session…|Restarting the cloud session…|Waiting for your answer…|Waiting for file edit permission\.\.\.|Waiting for shell command permission\.\.\.|Waiting for tool permission\.\.\.|Permission granted|Permission denied|Question cancelled|Insufficient credits|Model not available|Premium credits exhausted|Spend limit reached|Usage limit reached|Error|No active session to unshare)', '(?:Interrupted · What should Command Code do instead\?|Executing: [^\r\n]+|Theme set to: [^\r\n]+|Model set to [^\r\n]+|Provider set to [^\r\n]+|Provider authentication [^\r\n]+|Run /connect to [^\r\n]+|Cloning [^\r\n]+|Updating [^\r\n]+|Language set to: [^\r\n]+|Could not save language: [^\r\n]+|Compact mode set to: [^\r\n]+|Switched to [^\r\n]+|Failed to unshare: [^\r\n]+|Command Code authentication successful|Anthropic authentication successful|GitHub Copilot authentication successful)', '(?:OpenAI ChatGPT/Codex authentication successful|OpenAI authentication successful|Connection dropped mid-response\. Retrying\.\.\. \([0-9]+/[0-9]+\)|Connection issue\. Retrying\.\.\. \(attempt [0-9]+\)|Setting effort to [^\r\n]+ in the cloud…|Switching to [^\r\n]+ in the cloud…)'] } },
  { prefix = { regex = '(?m)^(?P<prefix>\S[^\r\n]*(?:[ \t]*\r?\n\S[^\r\n]*)*)[ \t]*\s*\z', min_chars = 6, patterns = ['Connection Issue\. Retrying \(attempt [0-9]+\)\.{0,3}'] } },
  { regex = ['(?m)^ ?[·☆⌘◇○✧][ \t]*Connecting(?:[ \t]+|\r?\n {2,3})to(?:[ \t]+|\r?\n {2,3})the(?:[ \t]+|\r?\n {2,3})cloud…(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ ?[·☆⌘◇○✧][ \t]*Creating(?:[ \t]+|\r?\n {2,3})a(?:[ \t]+|\r?\n {2,3})cloud(?:[ \t]+|\r?\n {2,3})session…(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ ?[·☆⌘◇○✧][ \t]*Restarting(?:[ \t]+|\r?\n {2,3})the(?:[ \t]+|\r?\n {2,3})cloud(?:[ \t]+|\r?\n {2,3})session…(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ ?[·☆⌘◇○✧][ \t]*Starting(?:[ \t]+|\r?\n {2,3})the(?:[ \t]+|\r?\n {2,3})cloud(?:[ \t]+|\r?\n {2,3})session…(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ ?[·☆⌘◇○✧][ \t]*Loading(?:[ \t]+|\r?\n {2,3})the(?:[ \t]+|\r?\n {2,3})conversation…(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ ?[·☆⌘◇○✧][ \t]*Cloning(?:[ \t]+|\r?\n {2,3})\S[^\r\n]*(?:\r?\n {2,3}\S[^\r\n]*)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ ?[·☆⌘◇○✧][ \t]*Setting(?:[ \t]+|\r?\n {2,3})effort(?:[ \t]+|\r?\n {2,3})to(?:[ \t]+|\r?\n {2,3})\S[^\r\n]*(?:\r?\n {2,3}\S[^\r\n]*)*(?:[ \t]+|\r?\n {2,3})in(?:[ \t]+|\r?\n {2,3})the(?:[ \t]+|\r?\n {2,3})cloud…(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ ?[·☆⌘◇○✧][ \t]*Switching(?:[ \t]+|\r?\n {2,3})to(?:[ \t]+|\r?\n {2,3})\S[^\r\n]*(?:\r?\n {2,3}\S[^\r\n]*)*(?:[ \t]+|\r?\n {2,3})in(?:[ \t]+|\r?\n {2,3})the(?:[ \t]+|\r?\n {2,3})cloud…(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
]

# The box proves readiness even when a tall draft hides the hint row.
# Normal/plan/accept-edits use ❯ (or ASCII >); shell-input uses !.
# Only the live footer above it may suppress idle; draft contents cannot.
[[rules]]
id = "composer_prompt"
state = "idle"
priority = 100
region = "full_width_prompt_box_body"
visible_idle = true
line_regex = ['^\s*[❯!>](?:\s|$)']
not = [
  { region = "above_full_width_prompt_box", any = [
    { prefix = { regex = '(?m)^ ?[·☆⌘◇○✧][ \t]*(?P<prefix>\S[^\r\n]*?)(?:[ \t]+(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z', min_chars = 6, patterns = ['(?:Pondering…|Contemplating…|Reasoning…|Reflecting…|Considering…|Deliberating…|Analyzing…|Evaluating…|Examining…|Inspecting…|Investigating…|Reviewing…|Researching…|Studying…|Exploring…|Mapping…|Tracing…|Parsing…|Processing…|Calculating…|Computing…|Synthesizing…|Planning…|Outlining…|Sketching…|Drafting…|Composing…|Crafting…|Building…|Assembling…|Constructing…|Designing…|Formulating…|Structuring…|Organizing…|Preparing…|Refining…|Polishing…|Honing…|Tuning…|Aligning…|Connecting…|Resolving…|Weaving…|Threading…)', '(?:Sculpting…|Crystallizing…|Channeling…|Conjuring…|Brewing…|Working…|Cogitating…|Ruminating…|Hypothesizing…|Conceptualizing…|Philosophizing…|Deciphering…|Demystifying…|Articulating…|Illuminating…|Elaborating…|Orchestrating…|Choreographing…|Architecting…|Calibrating…|Materializing…|Visualizing…|Harmonizing…|Contemplificating…|Supercalifragilisting…|Bibbidibobbidibooing…|Abracadabraing…|Hocuspocusing…|Razzmatazzing…|Shell command allowed|Shell command denied|Process termination allowed)', '(?:Process termination denied|Tool call allowed|Tool call denied|File operation allowed|File operation denied|Compacting conversation\.\.\.|Ready\.\.\.|Answers submitted|Failed to set provider|Restore failed|Connecting to the cloud…|Loading the conversation…|Loading the conversation|Starting the cloud session|Starting the cloud session…|Checking for updates\.\.\.|Naming session…|Failed to set model|Failed to set theme|Failed to set compact mode|Restoring checkpoint\.\.\.|Removing share link\.\.\.)', '(?:Context limit reached\. Auto-compacting the conversation\.\.\.|C