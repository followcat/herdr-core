# Screen rules for Command Code (`cmd` CLI, npm package `command-code`).
# Written for this fork from captured screens; no herdr manifest exists.
# Derived from the installed Command Code 1.88.3 renderer (read-only bundle),
# plus captured 1.88.2–1.88.3 screens. Built-in status labels only.
# English UI only; translated labels and unbounded remote setup messages
# are outside this inventory.
# Known gap: arbitrary mod-provided status text is not recognized. A mod
# rendering the same bytes as built-in UI is inherently indistinguishable.
id = "command-code"
version = "2026.11.05.13"
min_engine_version = 6
updated_at = "2026-11-05T06:20:39Z"
aliases = ["command_code"]

# The first-run folder-trust dialog: "Do you trust the files in this
# folder?" with numbered Yes/No and "↑/↓ to navigate · enter to select ·
# esc to exit" (cmd-trust-dialog fixture).
[[rules]]
id = "trust_folder_dialog"
state = "blocked"
kind = "permission"
priority = 300
region = "outside_full_width_prompt_box"
visible_blocker = true
regex = ['(?i)do\s+you\s+trust\s+the\s+files\s+in\s+this\s+folder\?', '(?i)enter\s+to\s+select', '(?i)esc\s+to\s+exit']
line_regex = ['^\s*❯?\s*\d+\.\s+(?i:yes|no)\b']

# Tool permissions replace the composer below the last divider. Require
# the dialog's own wording, Yes/No choices and selection controls; draft
# text inside a composer is outside this region.
[[rules]]
id = "tool_permission_dialog"
state = "blocked"
kind = "permission"
priority = 290
region = "after_last_full_width_rule"
visible_blocker = true
# Whitespace between words is equivalent to joining wrapped rows with one
# space. Keep choice rows physical, and require both Yes and No evidence.
regex = [
  '(?i)\benter\s+select\b',
  # The No choice must be last: subsequent rows may be wrapped label words
  # or controls, never another numbered option. Risk removes scoped Yes.
  '(?m)^[ \t]*[❯›]?[ \t]*\d+\.[ \t]+(?i:no)\b[^\r\n]*(?:\r?\n[ \t]*(?:[^\s\d❯›][^\r\n]*)?)*[ \t]*\z',
]
line_regex = ['^\s*❯?\s*1\.\s+(?i:yes)\b']
# PermissionPrompt, ShellPermissionPrompt and GenericPermissionPrompt have
# different headings/questions but the same choice/footer structure.
any = [
  { regex = ['(?i)\bcommand\s+code\s+needs\s+to\s+(?:execute|run)\b'], any = [
    { regex = ['(?im)^\s*Execute\s+Shell\s+Command\s*$'] },
    { regex = ['(?im)^\s*Tool\s+Permission\s*$'] },
  ] },
  { regex = ['(?i)\bdo\s+you\s+want\s+to\s+(?:make\s+this\s+edit\s+to|create|delete|execute|modify)\b'], any = [
    { regex = ['(?im)^\s*Edit\s+File(?:\s|$)'] },
    { regex = ['(?im)^\s*(?:Create\s+File|Delete\s+File|Execute\s+File|File\s+Operation)\s*$'] },
  ] },
]

# Status/_G emits exactly one leading space before CMDIcon. Assistant
# continuation text begins at column 2, and WorkedDurationNote is absent
# below 1000ms: do not rely on a summary to retire a reply-shaped fake.
# The live turn footer ends the transcript above the composer, optionally
# followed by the captured Tip, including wrapped words. The six observed
# spinners exclude summary/message markers. Compact counters and bare verbs
# share this shape; a wrapped full-footer remainder must immediately follow
# the activity line. Older footers followed by a reply cannot claim working.
[[rules]]
id = "turn_footer"
state = "working"
priority = 200
region = "above_full_width_prompt_box"
visible_working = true
any = [
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Pondering…|Contemplating…|Reasoning…|Reflecting…|Considering…|Deliberating…|Analyzing…|Evaluating…|Examining…|Inspecting…|Investigating…|Reviewing…|Researching…)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Studying…|Exploring…|Mapping…|Tracing…|Parsing…|Processing…|Calculating…|Computing…|Synthesizing…|Planning…|Outlining…|Sketching…|Drafting…|Composing…|Crafting…)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Building…|Assembling…|Constructing…|Designing…|Formulating…|Structuring…|Organizing…|Preparing…|Refining…|Polishing…|Honing…|Tuning…|Aligning…|Connecting…)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Resolving…|Weaving…|Threading…|Sculpting…|Crystallizing…|Channeling…|Conjuring…|Brewing…|Working…|Cogitating…|Ruminating…|Hypothesizing…|Conceptualizing…)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Philosophizing…|Deciphering…|Demystifying…|Articulating…|Illuminating…|Elaborating…|Orchestrating…|Choreographing…|Architecting…|Calibrating…|Materializing…)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Visualizing…|Harmonizing…|Contemplificating…|Supercalifragilisting…|Bibbidibobbidibooing…|Abracadabraing…|Hocuspocusing…|Razzmatazzing…)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:(?:Shell command|Process termination|Tool call|File operation) (?:allowed|denied)|Executing: [^\r\n]+|Compacting conversation\.\.\.|Ready\.\.\.|Answers submitted)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Theme set to: [^\r\n]+|(?:Model|Provider) set to [^\r\n]+|Provider authentication [^\r\n]+|Run /connect to [^\r\n]+|[A-Za-z][A-Za-z0-9 -]* authentication [^\r\n]+)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Failed to set provider|Restore failed|Connecting to the cloud…|(?:Loading the conversation|Starting the cloud session)(?:…)?|Cloning [^\r\n]+)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Checking for updates\.\.\.|Updating [^\r\n]+|Naming session…|(?:Setting effort to|Switching to) [^\r\n]+ in the cloud…|Failed to set (?:model|theme|compact mode))(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Language set to: [^\r\n]+|Restoring checkpoint\.\.\.|Removing share link\.\.\.|Connection issue\. Retrying\.\.\.(?: \(attempt \d+\))?)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Context limit reached\.(?: Auto-compacting the conversation\.\.\.)?|Connecting to the cloud|(?:Creating a|Restarting the) cloud session…|Compact mode set to: [^\r\n]+)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Waiting for your answer…|Waiting for (?:file edit|shell command)(?: permission\.\.\.)?|Waiting for tool permission\.\.\.|Permission (?:granted|denied))(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Question cancelled|Insufficient credits|Model not available|Premium credits exhausted|(?:Spend|Usage) limit reached|Error|Switched to [^\r\n]+)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ ?[·☆⌘◇○✧][ \t]+(?:Could not save language:[^\r\n]*|Connection dropped mid-response\.(?: Retrying\.\.\. \(\d+/\d+\))?)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]*(?:Setting effort to|Switching to) [^\r\n]+(?:\r?\n {2,3}\S[^\r\n]*)*(?:[ \t]+|\r?\n {2,3})in(?:[ \t]+|\r?\n {2,3})the(?:[ \t]+|\r?\n {2,3})cloud…[ \t]*\s*\z'] },
  { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:No active session to unshare|Failed to unshare: [^\r\n]+|Interrupted · What should Command Code do instead\?)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
  { regex = ['(?m)^Connection Issue\. Retrying \(attempt \d+\)\.{0,3}[ \t]*\s*\z'] },
]

# The list includes updater, rename, settings, permissions, submit errors
# and harness retry/compaction setters. Cloud waits use ShimmerLine (which
# wraps); ordinary Status has height 1 and can clip a long built-in label.
# The box proves readiness even when a tall draft hides the hint row.
# Normal/plan/accept-edits use ❯ (or ASCII >); shell-input uses !.
# Only the live footer above it may suppress idle; draft contents cannot.
[[rules]]
id = "composer_prompt"
state = "idle"
priority = 100
region = "full_width_prompt_box_body"
visible_idle = true
line_regex = ['^\s*[❯!>](?:\s|$)']
not = [
  { region = "above_full_width_prompt_box", any = [
    { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Pondering…|Contemplating…|Reasoning…|Reflecting…|Considering…|Deliberating…|Analyzing…|Evaluating…|Examining…|Inspecting…|Investigating…|Reviewing…|Researching…)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
    { regex = ['(?m)^ [·☆⌘◇○✧][ \t]+(?:Studying…|Exploring…|Mapping…|Tracing…|Parsing…|Processing…|Calculating…|Computing…|Synthesizing…|Planning…|Outlining…|Sketching…|Drafting…|Composing…|Crafting…)(?:[ \t]{2,}(?:\d+(?:\.\d+)?k?|esc to interrupt[^\r\n]*))?(?:\r?\n[ \t]*(?:esc to interrupt[^\r\n]*|•[ \t]+\d[^\r\n]*|\d+(?:\.\d+)?k?))?(?:\r?\n[ \t]*⎿[ \t]+Tip:\s+Use\s+shift\+tab\s+to\s+enable\s+accept\s+edits)*(?:\r?\n {3}Large\s+repo:\s+it\s+is\s+cloned\s+once\s+per\s+session,\s+and\s+reopening\s+is\s+fast\.)?\s*\z'] },
