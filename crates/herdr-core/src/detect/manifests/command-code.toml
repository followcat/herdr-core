# Screen rules for Command Code (`cmd` CLI, npm package `command-code`).
# Written for this fork from captured screens; no herdr manifest exists.
# Command Code 1.88.2–1.88.3: turn footers above the composer and tool
# permission dialogs are captured alongside trust, draft and idle screens.
id = "command-code"
version = "2026.11.05.2"
min_engine_version = 4
updated_at = "2026-11-05T00:00:00Z"
aliases = ["command_code"]

# The first-run folder-trust dialog: "Do you trust the files in this
# folder?" with numbered Yes/No and "↑/↓ to navigate · enter to select ·
# esc to exit" (cmd-trust-dialog fixture).
[[rules]]
id = "trust_folder_dialog"
state = "blocked"
kind = "permission"
priority = 300
region = "bottom_non_empty_lines(14)"
visible_blocker = true
contains = ["do you trust the files in this folder?", "enter to select", "esc to exit"]
line_regex = ['^\s*❯?\s*\d+\.\s+(?i:yes|no)\b']

# Tool permissions replace the composer below the last divider. Require
# the dialog's own wording, a Yes choice and its selection controls; draft
# text inside a composer is outside this region.
[[rules]]
id = "tool_permission_dialog"
state = "blocked"
kind = "permission"
priority = 290
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["command code needs to", "enter select"]
line_regex = ['^\s*❯?\s*1\.\s+(?i:yes)\b']

# The live turn footer ends the transcript above the composer, optionally
# followed by a Tip line. Require that tail position so an older retained
# footer cannot claim a completed reply. Spinner and activity labels vary.
[[rules]]
id = "turn_footer"
state = "working"
priority = 200
region = "above_prompt_box"
visible_working = true
regex = ['(?m)^[ \t]*[·☆⌘◇○✧][ \t]+\S[^\n]*esc to interrupt[ \t]+•[ \t]+\d[^\n]*(?:\n[ \t]*⎿[ \t]+Tip:[^\n]*)?\s*\z']

# The box proves readiness even when a tall draft hides the hint row.
# Only the live footer above it may suppress idle; draft contents cannot.
[[rules]]
id = "composer_prompt"
state = "idle"
priority = 100
region = "prompt_box_body"
visible_idle = true
line_regex = ['^\s*❯(?:\s|$)']
not = [
  { region = "above_prompt_box", regex = ['(?m)^[ \t]*[·☆⌘◇○✧][ \t]+\S[^\n]*esc to interrupt[ \t]+•[ \t]+\d[^\n]*(?:\n[ \t]*⎿[ \t]+Tip:[^\n]*)?\s*\z'] },
]

# The slash-command menu over the composer: "❯ /" plus " /cmd   hint" rows
# (cmd-slash-menu fixture). Still idle: the agent waits for input.
[[rules]]
id = "slash_menu"
state = "idle"
priority = 90
region = "bottom_non_empty_lines(12)"
visible_idle = true
line_regex = ['^\s*❯\s*/', '^\s*/\S+\s{2,}\S']
